# ThySqueal server configuration.
# Every field is optional; omitted fields use the defaults shown here.
# A different file can be selected with `thy-squeal --config <path>`.

bind_address: "127.0.0.1:5931"

databases:
  # general purpose db; inherits the global cache.max_entries
  - name: main
    path: "db/thy-squeal.db"
    max_connections: 5

  # heavy read db; its own larger cache
  - name: catalog
    path: "db/catalog.db"
    cache:
      max_entries: 10000

  # heavy write db; select caching disabled
  - name: logs
    path: "db/logs.db"
    cache:
      max_entries: 0

request:
  body_limit_bytes: 1048576
  timeout_seconds: 30

long_poll:
  timeout_seconds: 30
  max_waiters: 1000
  max_waiters_per_client: 10

cache:
  max_entries: 1000
  max_age_seconds: 0
  collection_threshold_entries: 0
  collection_threshold_bytes: 0
  collection_interval_seconds: 0
